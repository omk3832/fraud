spring.application.name=fraud-detection-service
# ML: local = Java only (XGBoost4J + files under classpath:ml/). http = calls python_ml on ml.api.url (needs Python running).
# Like your other app: use local, ship model.json + feature_list.json (+ de_template_defaults.json), run only this service.
fraud.ml.transport=local
fraud.ml.enabled=true
# Replace src/main/resources/ml/* with output of python_ml/export_for_java.py for your real model (current files are a tiny dev placeholder).
fraud.ml.local.model-resource=classpath:ml/model.json
fraud.ml.local.feature-list-resource=classpath:ml/feature_list.json
fraud.ml.local.template-resource=classpath:ml/de_template_defaults.json
# Edges for pd.cut-style deciles (11 floats for 10 bins). Replace with bins exported from xgb_decile_bins_*.pkl to match Python.
fraud.ml.local.decile-bins-resource=classpath:ml/decile_bins.json
# true: call real DE at de.api.url. false: see application-local.properties (stub or body→ML).
fraud.de.enabled=true
# true = no call to localhost:8081; uses classpath DE JSON (local testing). Set false when real DE is up.
fraud.de.stub.enabled=true
fraud.de.stub.resource=classpath:local-stub/de_features_stub.json
de.api.url=http://localhost:8081
ml.api.url=http://localhost:8001
# DE + ML HTTP timeouts (20ms/30ms is too short for real services and causes silent fallbacks or errors).
de.timeout=20ms
ml.timeout=30s
# ============================================================================
# [FEATURE-ALLOWLIST] → see com.fraud.util.FeatureFilter.java
# fraud.features.file-path = disk file your ops cron updates
# fraud.features.reload.cron = when JVM re-reads that file (Spring 6-field cron)
# ============================================================================
# --- Feature allowlist (FeatureFilter) ---
# Why external path: ops can add keys via file on disk without rebuilding the JAR; classpath features.txt is the dev fallback.
# Why scheduled cron: JVM must re-read that file to refresh RAM; your system cron only updates the file, not Java memory.
# Example Windows: fraud.features.file-path=C:/fraud/features.txt
# Example macOS/Linux: fraud.features.file-path=/etc/fraud/features.txt
fraud.features.file-path=
# Spring 6-field cron (sec min hour day month weekday). Default 07:00:00 daily in JVM default timezone (set TZ in prod if needed).
fraud.features.reload.cron=0 0 7 * * *
resilience4j.circuitbreaker.instances.deService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.deService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.deService.slidingWindowSize=10

resilience4j.bulkhead.instances.deService.maxConcurrentCalls=100